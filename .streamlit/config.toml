[theme]
# ธีม dark neon ให้ตรงกับ CSS ใน theme.py (ใช้ทั้งในเครื่องและบน Streamlit Cloud)
base = "dark"
primaryColor = "#38D0FF"
backgroundColor = "#05070F"
secondaryBackgroundColor = "#0B1220"
textColor = "#E6F1FF"

[server]
headless = true
# ห้ามตั้ง port ตายตัวในไฟล์นี้: Streamlit Cloud ตรวจสุขภาพแอปที่พอร์ต 8501
# ถ้า pin port อื่นไว้ cloud จะขึ้น "connection refused"
# เวลารันในเครื่องให้ระบุพอร์ตผ่าน command line แทน เช่น --server.port 8783

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
